# Database defaults are retained for this sanitization task.
# Database/profile separation is a follow-up task.
spring.datasource.url=${DB_URL:jdbc:h2:mem:greenfield;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-test-query=SELECT 1

# Mock is the default and never calls OnePipe. Only real mode resolves provider settings.
onepipe.mode=${ONEPIPE_MODE:mock}
# Required only for explicitly selected real mode; no credential defaults are provided.
onepipe.base-url=${ONEPIPE_BASE_URL}
onepipe.api-key=${ONEPIPE_API_KEY}
onepipe.client-secret=${ONEPIPE_CLIENT_SECRET}
onepipe.webhook-url=${ONEPIPE_WEBHOOK_URL}

# Supply a private Base64-encoded signing key; no shared default is provided.
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# No privileged accounts are created unless explicitly enabled and configured.
app.demo.seed.enabled=${DEMO_SEED_ENABLED:false}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.demo.branch-admin.password=${DEMO_BRANCH_ADMIN_PASSWORD:}
