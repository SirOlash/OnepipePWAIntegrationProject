# Required PostgreSQL settings; missing or blank values fail before database startup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns PostgreSQL DDL. Boot initializes it before Hibernate validation.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.fail-on-missing-locations=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.h2.console.enabled=false

# Small connection pool for an optional hosted portfolio demonstration.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Hosted demonstration never enables the real provider, even through overrides.
onepipe.mode=mock
server.address=0.0.0.0
