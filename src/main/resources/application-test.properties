# Boot creates a different in-memory H2 database for each application context.
spring.datasource.generate-unique-name=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.h2.console.enabled=false

# The environment guard rejects real-provider or seeding overrides in this profile.
onepipe.mode=mock
app.demo.seed.enabled=false
server.address=127.0.0.1
# Signing keys are generated privately by tests; no test key is committed here.
