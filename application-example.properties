# Reference only: Spring Boot does not automatically load this file or a .env file.
# Supply private settings in your shell or IDE; do not import this entire reference.
# Never put real credentials in this example or in tracked application properties.
# Select exactly one profile explicitly via SPRING_PROFILES_ACTIVE or CLI/IDE:
# dev, test, or hosted. There is no default profile; mixed/unknown profiles fail.
# See docs/configuration.md for complete setup and private JWT generation.

spring.application.name=greenfield
server.port=${PORT:8080}

# mock is the default. Only dev permits explicit real mode; test/hosted require mock.
# Mode values are case-insensitive; blank/unsupported values fail startup.
onepipe.mode=${ONEPIPE_MODE:mock}
# Required only for explicit dev real mode. Mock needs none of these settings.
# Do not use the historical internship credentials or environment.
onepipe.base-url=${ONEPIPE_BASE_URL}
onepipe.api-key=${ONEPIPE_API_KEY}
onepipe.client-secret=${ONEPIPE_CLIENT_SECRET}
onepipe.webhook-url=${ONEPIPE_WEBHOOK_URL}
# ONEPIPE_WEBHOOK_URL is the full callback URL, including /api/webhooks/onepipe.
# A configured URL does not imply that webhook verification is implemented.

# Required: a private Base64-encoded JWT signing key with at least 32 random bytes.
# Generate it locally; never use a shared example key or commit its value.
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Database declarations belong to the selected profile, not shared configuration.
# dev: H2 in-memory greenfield-dev, create-drop schema, loopback HTTP binding.
# test: an isolated generated H2 database name, create-drop, mock, no demo seeding.
# H2 dialect detection is automatic. No manual driver/dialect override is needed.
# Tests supply a transient JWT key; no shared test JWT is supplied here.

# hosted ONLY: these declarations live in application-hosted.properties.
# All DB settings below are required and have no H2/credential fallback.
# DB_URL must be a PostgreSQL JDBC URL, including required SSL/connection options.
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.hibernate.ddl-auto=validate
# spring.datasource.hikari.maximum-pool-size=5
# spring.datasource.hikari.minimum-idle=1
# spring.datasource.hikari.connection-timeout=30000
# server.address=0.0.0.0
# PORT defaults to 8080. DB_DRIVER_CLASS is not used.
# An empty hosted database cannot initialize until later schema migrations exist.
# This file does not create a database, deploy a service, or verify a connection.

# Disabled by default; automatic seeding exists only under the dev profile.
# Hosted excludes it even when enabled; test rejects a seeding override.
# Dev opt-in requires all three seed settings below to be nonblank.
# Choose private passwords independently; no example passwords are provided.
# The branch uses a synthetic identity and invalid banking/provider identifiers.
# These fixtures are for demonstration data, not real provider operations.
app.demo.seed.enabled=${DEMO_SEED_ENABLED:false}
# Separate opt-in for synthetic collections; only dev + mock + authenticated SUPER_ADMIN.
# The endpoint is absent in test/hosted/real mode even when this flag is true.
app.demo.payments.simulation.enabled=${DEMO_PAYMENT_SIMULATION_ENABLED:false}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.demo.branch-admin.password=${DEMO_BRANCH_ADMIN_PASSWORD:}
# Existing accounts are preserved; configuration changes do not rotate passwords.
# Reuse requires expected roles and matching demo identity/ownership, not just email.
# An orphaned branch admin requires its current password before a branch is linked.
# Keep SUPER_ADMIN_EMAIL stable; changing it is not an account rename.
# Initialization is one database transaction; conflicts/failures roll back changes.
# See docs/configuration.md#demo-seeding for repeatability and partial-state rules.
