# Reference only: Spring Boot does not automatically load this file or a .env file.
# Export environment variables in your shell or supply an ignored local override
# explicitly with --spring.config.additional-location=file:./application-local.properties.
# Never put real credentials in this example or in tracked application.properties.
# Do not activate the real provider using the historical internship environment.
# Credential-free mock startup and separate database profiles are follow-up tasks.

# Required by the currently active real adapter. No credentials are supplied here.
onepipe.base-url=${ONEPIPE_BASE_URL}
onepipe.api-key=${ONEPIPE_API_KEY}
onepipe.client-secret=${ONEPIPE_CLIENT_SECRET}
onepipe.webhook-url=${ONEPIPE_WEBHOOK_URL}
# ONEPIPE_WEBHOOK_URL is the full callback URL, including /api/webhooks/onepipe.
# A configured URL does not imply that webhook verification is implemented.

# Required: a private Base64-encoded JWT signing key with at least 32 random bytes.
# Generate it locally; never use a shared example key or commit its value.
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Existing H2 defaults are retained. They are not a persistent hosted-demo setup.
# For PostgreSQL, supply a JDBC DB_URL plus credentials and set
# DB_DRIVER_CLASS=org.postgresql.Driver. The H2/PostgreSQL dialect split is pending.
spring.datasource.url=${DB_URL:jdbc:h2:mem:greenfield;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS:org.h2.Driver}

# Disabled by default: ordinary startup creates no privileged demo accounts.
# Explicit opt-in requires all three seed settings below to be nonblank.
# Choose private passwords independently; no example passwords are provided.
# The branch uses a synthetic identity and invalid banking/provider identifiers.
# These fixtures are for demonstration data, not real provider operations.
app.demo.seed.enabled=${DEMO_SEED_ENABLED:false}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.demo.branch-admin.password=${DEMO_BRANCH_ADMIN_PASSWORD:}
# Existing accounts are preserved; configuration changes do not rotate passwords.
